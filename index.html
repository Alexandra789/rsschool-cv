<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Frontend Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="resume">
        <header class="header">
            <div class="container">
                <div class="header__inner">
                    <img class="triangle-img" src="./assets/img/triangle.png" alt="triangle image">
                    <img class="line-img" src="./assets/img/line.png" alt="line image">
                    <div class="wrapper">
                        <div class="image-wrapper">
                            <div class="round black-round"></div>
                            <div class="round white-round"></div>
                            <img class="resume-img" src="/assets/img/resume-photo.jpg" alt="resume image">
                        </div>
                        <div class="contact-information">
                            <h1 class="resume__title">Alexandra Zakovinko</h1>
                            <p class="resume__position">Frontend Developer</p>
                            <ul class="contacts-list">
                                <li class="contacts-list__item"><img class="contacts-list__icons"
                                        src="/assets/img/icons/social/email.svg" alt=""><a class="contacts-list__link"
                                        href="mailto:zakovinko99@gmail.com">zakovinko99@gmail.com</a></li>
                                <li class="contacts-list__item"><img class="contacts-list__icons"
                                        src="/assets/img/icons/social/telegram.svg" alt=""><a
                                        class="contacts-list__link" href="https://t.me/usernameKW">usernameKW</a></li>
                                <li class="contacts-list__item"><img class="contacts-list__icons"
                                        src="/assets/img/icons/social/github.svg" alt=""><a class="contacts-list__link"
                                        href="https://github.com/Alexandra789">Alexandra789</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
